services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aesaas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aesaas"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  # P1 PR1: Trigger.dev v4 self-hosted infra (added, NOT yet wired into pipeline).
  # RUN_TRIGGER_DEV=0 default; no caller until P1 PR3 cut-over. See docs/refactor-plan-v0.1.md §7.4.
  clickhouse:
    image: clickhouse/clickhouse-server:23-alpine
    environment:
      CLICKHOUSE_DB: triggerdev
      CLICKHOUSE_USER: triggerdev
      CLICKHOUSE_PASSWORD: triggerdev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - chdata:/var/lib/clickhouse
    ports:
      - "8123:8123"   # HTTP (internal)
      - "9000:9000"   # native (internal — Trigger.dev worker uses this)
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  trigger-web:
    image: triggerdotdev/trigger.dev:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/triggerdev
      REDIS_URL: redis://redis:6379
      CLICKHOUSE_URL: http://clickhouse:8123
      SECRET_KEY: ${TRIGGER_SECRET_KEY:-trigger-dev-secret-change-me}
      NODE_ENV: development
    ports:
      - "3030:3030"
volumes:
  pgdata:
  chdata:
