services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aesaas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aesaas"]
      interval: 5s
      timeout: 3s
      retries: 10
  # P1 PR1 init: create the triggerdev database once per stack boot.
  # trigger-web container's DATABASE_URL points at triggerdev — without this init,
  # trigger-web startup fails with "database does not exist".
  init-trigger-db:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./scripts/init-trigger-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    entrypoint:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -U
      - postgres
      - -h
      - postgres
      - -d
      - aesaas
      - -f
      - /docker-entrypoint-initdb.d/01-init.sql
    restart: "no"
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  # P1 PR1: Trigger.dev v4 self-hosted infra (added, NOT yet wired into pipeline).
  # RUN_TRIGGER_DEV=0 default; no caller until P1 PR3 cut-over. See docs/refactor-plan-v0.1.md §7.4.
  clickhouse:
    image: clickhouse/clickhouse-server:23-alpine
    environment:
      CLICKHOUSE_DB: triggerdev
      CLICKHOUSE_USER: triggerdev
      CLICKHOUSE_PASSWORD: triggerdev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - chdata:/var/lib/clickhouse
    ports:
      - "8123:8123"   # HTTP (internal)
      - "9000:9000"   # native (internal — Trigger.dev worker uses this)
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  trigger-web:
    image: triggerdotdev/trigger.dev:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/triggerdev
      REDIS_URL: redis://redis:6379
      CLICKHOUSE_URL: http://clickhouse:8123
      # 强制 prod 必填 — `${VAR:-default}` 在 VAR unset 时静默用 weak default,
      # prod 是安全洞. Bash ${VAR:?msg} 在 VAR empty/unset 时 fail-fast, 把
      # responsibility 推给 deploy host 的 .env.local. dev 启动方式不变.
      SECRET_KEY: ${TRIGGER_SECRET_KEY:?TRIGGER_SECRET_KEY is required (set in .env.local or compose override)}
      NODE_ENV: development
    # Bind 到 host 127.0.0.1 — 不暴露公网. nginx (docs/nginx-auto-explainer.conf)
    # 在 :80 前置反代, basic auth 保护 dashboard. 不再让 :3030 直 0.0.0.0.
    ports:
      - "127.0.0.1:3030:3030"
volumes:
  pgdata:
  chdata:
