# nginx config for auto-explainer-saas
# Reference for ops team. Adjust /etc/nginx paths + htpasswd user for your env.
#
# Pipeline (prod):
#   Public internet → :80 (TLS termination upstream of nginx, or :443 ssl here)
#                    → nginx :80 → upstream "nextjs" (systemd-managed Next.js on 127.0.0.1:3000)
#                              → upstream "trigger" (docker-managed trigger-web on 127.0.0.1:3030)
#                              → basic auth via /etc/nginx/.htpasswd
#
# Decision #8 captured in docs/refactor-plan-v0.1.md §4: Nginx + basic auth.
# DO NOT expose :3000 (Next.js) or :3030 (trigger-web) directly to the internet;
# they're bound to host loopback via systemd --hostname 127.0.0.1 (Next.js) and
# docker-compose "127.0.0.1:3030:3030" mapping (trigger-web).
#
# After applying:
#   1. sudo htpasswd -c /etc/nginx/.htpasswd your-admin
#   2. sudo ln -sf /etc/nginx/sites-available/auto-explainer.conf /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload auto-explainer-nginx
#   4. Verify: curl -u <user>:<pass> http://127.0.0.1/api/health → 200

# Upstreams
upstream nextjs {
    server 127.0.0.1:3000;   # systemd-managed Next.js with --hostname 127.0.0.1
    keepalive 8;
}

upstream trigger_web {
    server 127.0.0.1:3030;   # docker compose "127.0.0.1:3030:3030" published loopback
    keepalive 8;
}

# Virtual host for the auto-explainer-saas API + Trigger.dev dashboard
# (single vhost: app + dashboard routed by location prefix)
server {
    listen 80;
    # Adjust server_name to your DNS / VPS host
    server_name _;

    # Basic auth (decision #8). htpasswd file is shared between locations.
    #   $ sudo apt-get install apache2-utils
    #   $ sudo htpasswd -c /etc/nginx/.htpasswd auto-explainer-admin
    auth_basic "auto-explainer-saas API + dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Optional: restrict source IPs (office/VPN only)
    # allow 10.0.0.0/8;
    # deny all;

    # Security headers — nginx strips upstream headers by default, so re-emit
    # the same set Next.js adds in next.config.mjs (defense in depth: also
    # makes headers present when accessed via this nginx vhost, regardless of
    # Next.js runtime).
    # `always` ensures 4xx/5xx responses also carry these.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # HSTS — only meaningful behind TLS termination (or :443). 6 months, include
    # subdomains. If you're on a non-TLS setup (dev), comment this line out —
    # browsers will refuse to load the page over http://.
    # add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    # Permissions-Policy — disable unused browser features.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Trigger.dev dashboard — proxied at /trigger/* (avoid colliding with Next.js /)
    # Trigger.dev dashboard root is /api/v1 (REST runs panel). Mount at /trigger/.
    location /trigger/ {
        # Strip /trigger prefix when forwarding to trigger-web
        rewrite ^/trigger/(.*)$ /$1 break;
        proxy_pass http://trigger_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Next.js app (POST /api/jobs, GET /api/jobs/[id], pages, polling, etc.)
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}

# Operational notes for ops team:
#   1. Generate htpasswd users: sudo htpasswd -B /etc/nginx/.htpasswd <username>
#   2. Validate config:  sudo nginx -t
#   3. Reload:           sudo systemctl reload auto-explainer-nginx
#   4. Sanity:
#        - curl -u <user>:<pass> http://127.0.0.1/api/health        → 200
#        - curl -u <user>:<pass> http://127.0.0.1/trigger/api/v1    → 200
#
# Health check used by scripts/deploy.sh:
#   $ curl -sf http://127.0.0.1:3000/api/health                     ← Next.js raw (loopback)
#     (VPS firewall closes :3000 from outside; nginx-fronted path is :80 + basic auth)
