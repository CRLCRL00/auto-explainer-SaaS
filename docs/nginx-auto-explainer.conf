# nginx config for auto-explainer-saas Trigger.dev dashboard
# Reference for ops team. Adjust /etc/nginx paths + htpasswd user for your env.
#
# Pipeline:
#   Public internet → :443 (TLS termination upstream of nginx)
#                    → nginx :80/:443 → http://127.0.0.1:3030 (trigger-web dashboard)
#                                  → basic auth via .htpasswd
#
# Decision #8 captured in docs/refactor-plan-v0.1.md §4: Nginx + basic auth.
# DO NOT expose trigger-web :3030 directly to the internet; the docker-compose
# service binds 3030 to the host loopback ONLY (see docker-compose.yml).

# Virtual host for the Trigger.dev dashboard (NOT the Next.js app)
server {
    listen 127.0.0.1:3030;
    server_name trigger-dashboard.local;

    # Reverse proxy to the in-container trigger-web (PR1 added this service).
    # Note: when running on a single host, trigger-web is bound to host loopback
    # via "127.0.0.1:3030" in docker-compose.yml. If trigger-web runs on a
    # different host, replace `127.0.0.1:3030` with that host's address.
    # Inside the docker-compose network the service is `trigger-web`; the host
    # loopback binding is what nginx → here hits.
    # (nginx listens on the same port that docker exposes the dashboard,
    #  so this config is illustrative — in practice use a distinct port
    #  like :3080 for nginx-fronted dashboard and keep :3030 loopback.)

    # Basic auth (decision #8). htpasswd file:
    #   $ sudo apt-get install apache2-utils
    #   $ sudo htpasswd -c /etc/nginx/.htpasswd auto-explainer-admin
    auth_basic "Trigger.dev dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Optional: only allow from your office/VPN IPs
    # allow 10.0.0.0/8;
    # deny all;

    # Pass-through to trigger-web
    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}

# Operational note for ops team:
#   1. Run `htpasswd -c /etc/nginx/.htpasswd <username>` then add to secret store.
#   2. nginx -t && systemctl reload nginx
#   3. Verify via curl -u <user>:<pass> http://127.0.0.1:<port>/api/v1 — should 200.
#
# Health check used by scripts/deploy.sh:
#   $ curl -sf -u $AUTH_USER:$AUTH_PASS http://127.0.0.1:3030/api/v1
# (script already in place, needs AUTH_USER / AUTH_PASS env on the deploy host.)
